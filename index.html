<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه متمرکز پایش GIS</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="app-layout">
        <!-- دکمه باز و بستن پنل -->
        <button id="sidebar-toggle" class="sidebar-toggle-btn" title="تغییر وضعیت پنل">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Sidebar آکاردئونی مدیریت ۲۰ ماژول -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-earth-americas" style="color: var(--primary);"></i> سامانه GIS متمرکز</h2>
            </div>

            <div class="sidebar-content">
                
                <!-- اکاردئون ۱: لایه‌های پایه -->
                <div class="accordion-item active">
                    <div class="accordion-header">
                        <span><i class="fa-solid fa-layer-group"></i> نقشه‌های پایه (Base Map)</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="accordion-content" id="base-layers-container"></div>
                </div>

                <!-- اکاردئون ۲: گام ۱ - ناوبری و مسیریابی -->
                <div class="accordion-item">
                    <div class="accordion-header">
                        <span><i class="fa-solid fa-route"></i> ۱. مسیریابی و جستجو</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="accordion-content">
                        <div class="form-group">
                            <input type="text" id="geo-search-input" class="input-style" placeholder="نام مکان یا شهر..." />
                            <button id="geo-search-btn" class="btn" style="margin-top:5px;"><i class="fa-solid fa-magnifying-glass"></i> جستجو</button>
                        </div>
                        <button id="btn-set-start" class="btn btn-success"><i class="fa-solid fa-location-dot"></i> تعیین مبدأ روی نقشه</button>
                        <button id="btn-set-end" class="btn"><i class="fa-solid fa-flag-checkered"></i> تعیین مقصد روی نقشه</button>
                        <button id="btn-clear-route" class="btn btn-danger"><i class="fa-solid fa-trash"></i> پاک‌سازی مسیر</button>
                        <div id="route-info" style="margin-top:10px; font-size:11px; color:#38bdf8;"></div>
                    </div>
                </div>

                <!-- اکاردئون ۳: گام ۲ - ترافیک واقعی‌زمان -->
                <div class="accordion-item">
                    <div class="accordion-header">
                        <span><i class="fa-solid fa-car"></i> ۲. ترافیک واقعی‌زمان</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="accordion-content">
                        <label class="layer-checkbox">
                            <input type="checkbox" id="chk-traffic-flow">
                            <span>لایه وضعیت ترافیک آنلاین (TomTom/Flow)</span>
                        </label>
                    </div>
                </div>

                <!-- اکاردئون ۴: گام ۳ - هواشناسی و اقلیم -->
                <div class="accordion-item">
                    <div class="accordion-header">
                        <span><i class="fa-solid fa-cloud-sun-rain"></i> ۳. هواشناسی و اقلیم</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="accordion-content">
                        <label class="layer-checkbox">
                            <input type="checkbox" id="chk-weather-clouds">
                            <span>پوشش ابر زنده</span>
                        </label>
                        <label class="layer-checkbox" style="margin-top:8px;">
                            <input type="checkbox" id="chk-weather-precipitation">
                            <span>رادار بارش و بارندگی</span>
                        </label>
                        <div id="weather-info-box" style="margin-top:10px; font-size:12px; background:rgba(255,255,255,0.05); padding:8px; border-radius:6px;">
                            برای مشاهده پیش‌بینی آنلاین روی هر نقطه از نقشه کلیک کنید.
                        </div>
                    </div>
                </div>

                <!-- جا برای ماژول‌های ۴ تا ۲۰ (در گام‌های بعدی پر می‌شوند) -->

            </div>
        </aside>

        <!-- نقشه اصلی -->
        <main class="map-container" id="map"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
