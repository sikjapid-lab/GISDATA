<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه پیشرفته GIS و پایش متمرکز</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Leaflet & Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="app-layout">
        <!-- دکمه باز و بستن پنل اصلی -->
        <button id="sidebar-toggle" class="sidebar-toggle-btn" title="مدیریت پنل">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Sidebar آکاردئونی شیشه‌ای -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-earth-americas text-accent"></i> سامانه GIS متمرکز</h2>
            </div>

            <div class="sidebar-content">
                
                <!-- ۱. ناوبری و مسیریابی -->
                <div class="accordion-item active">
                    <div class="accordion-header">
                        <span><i class="fa-solid fa-route"></i> ۱. مسیریابی و جستجو</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="accordion-content">
                        <div class="form-group">
                            <input type="text" id="geo-search-input" class="input-style" placeholder="نام مکان یا شهر..." />
                            <button id="geo-search-btn" class="btn" style="margin-top:5px;"><i class="fa-solid fa-magnifying-glass"></i> جستجو</button>
                        </div>
                        <button id="btn-set-start" class="btn btn-success"><i class="fa-solid fa-location-dot"></i> تعیین مبدأ روی نقشه</button>
                        <button id="btn-set-end" class="btn"><i class="fa-solid fa-flag-checkered"></i> تعیین مقصد روی نقشه</button>
                        <button id="btn-clear-route" class="btn btn-danger"><i class="fa-solid fa-trash"></i> پاک‌سازی مسیر</button>
                        <div id="route-info" class="info-box" style="margin-top:10px;"></div>
                    </div>
                </div>

                <!-- ۲. ترافیک واقعی‌زمان -->
                <div class="accordion-item">
                    <div class="accordion-header">
                        <span><i class="fa-solid fa-car"></i> ۲. ترافیک واقعی‌زمان</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="accordion-content">
                        <label class="layer-checkbox">
                            <input type="checkbox" id="chk-traffic-google">
                            <span>ترافیک زنده گوگل (Google Traffic)</span>
                        </label>
                        <label class="layer-checkbox" style="margin-top: 8px;">
                            <input type="checkbox" id="chk-traffic-tomtom">
                            <span>جریان ترافیک TomTom Flow</span>
                        </label>
                        <label class="layer-checkbox" style="margin-top: 8px;">
                            <input type="checkbox" id="chk-traffic-tomtom-incidents">
                            <span>حوادث و انسداد جاده‌ای TomTom</span>
                        </label>
                        <div id="traffic-info-box" class="info-box" style="margin-top: 10px; display: none;"></div>
                    </div>
                </div>

                <!-- ۳. هواشناسی و اقلیم -->
                <div class="accordion-item">
                    <div class="accordion-header">
                        <span><i class="fa-solid fa-cloud-sun-rain"></i> ۳. هواشناسی و اقلیم</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="accordion-content">
                        <label class="layer-checkbox">
                            <input type="checkbox" id="chk-weather-radar">
                            <span>رادار بارش زنده (RainViewer)</span>
                        </label>
                        <label class="layer-checkbox" style="margin-top:8px;">
                            <input type="checkbox" id="chk-weather-clouds">
                            <span>پوشش ابر جهان (OWM)</span>
                        </label>
                        <div id="weather-info-box" class="info-box" style="margin-top: 10px;">
                            جهت مشاهده اطلاعات کامل هواشناسی روی نقشه کلیک کنید.
                        </div>
                    </div>
                </div>

                <!-- ۴. زلزله و بلایای طبیعی -->
                <div class="accordion-item">
                    <div class="accordion-header">
                        <span><i class="fa-solid fa-volcano"></i> ۴. زلزله و بلایای طبیعی</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="accordion-content">
                        <label class="layer-checkbox">
                            <input type="checkbox" id="chk-disaster-earthquakes">
                            <span>زلزله‌های زنده جهان (USGS 24h)</span>
                        </label>
                        <div class="form-group" style="margin-top: 8px;">
                            <label>حداقل بزرگی (ریشتر):</label>
                            <select id="select-eq-mag" class="input-style">
                                <option value="all">همه زلزله‌ها</option>
                                <option value="2.5">بزرگتر از ۲.۵</option>
                                <option value="4.5">بزرگتر از ۴.۵ (شدید)</option>
                            </select>
                        </div>
                        <div id="disaster-info-box" class="info-box" style="margin-top: 10px;">
                            تعداد زلزله‌های بارگذاری شده: <b id="eq-count">۰</b>
                        </div>
                    </div>
                </div>

                <!-- ۵. تنظیمات و کلیدهای API -->
                <div class="accordion-item">
                    <div class="accordion-header">
                        <span><i class="fa-solid fa-sliders"></i> ۵. تنظیمات و کلیدهای API</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="accordion-content">
                        <div class="form-group">
                            <label>OpenWeatherMap API Key:</label>
                            <input type="text" id="api-owm" class="input-style" placeholder="مقدار کلید..." />
                        </div>
                        <div class="form-group">
                            <label>TomTom API Key:</label>
                            <input type="text" id="api-tomtom" class="input-style" placeholder="مقدار کلید..." />
                        </div>
                        <button id="btn-save-settings" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> ذخیره تنظیمات</button>
                    </div>
                </div>

            </div>
        </aside>

        <!-- نقشه اصلی -->
        <main class="map-container" id="map">
            <!-- منوی شناور بیس‌لایر (گوشه بالا سمت چپ) -->
            <div class="base-map-floater">
                <button id="btn-base-map-toggle" class="floater-btn" title="تغییر نقشه پایه">
                    <i class="fa-solid fa-layer-group"></i>
                </button>
                <div id="base-map-dropdown" class="floater-dropdown"></div>
            </div>

            <!-- دکمه اختصاصی پرینت نقشه -->
            <button id="btn-print-map" class="floater-btn print-btn-floater" title="چاپ نقشه">
                <i class="fa-solid fa-print"></i>
            </button>

            <!-- نوار وضعیت مختصات در مرکز پایین صفحه -->
            <div class="status-bar-center" id="status-bar">
                <div class="coord-badge">
                    <span>DD:</span> <strong id="coord-dd">0.00000, 0.00000</strong>
                </div>
                <div class="coord-badge">
                    <span>DMS:</span> <strong id="coord-dms">0°0'0"N, 0°0'0"E</strong>
                </div>
                <div class="coord-badge">
                    <span>UTM:</span> <strong id="coord-utm">Z0 N | E:0 N:0</strong>
                </div>
            </div>
        </main>
    </div>

    <!-- Leaflet Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
